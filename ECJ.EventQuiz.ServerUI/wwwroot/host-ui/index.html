<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ECJ EventQuiz Server</title>
  <style>
    :root {
      --bg: #152033;
      --panel: #101a2a;
      --text: #e8eef8;
      --muted: #9aadc8;
      --ok: #2fbf71;
      --stop: #6b7c94;
      --accent: #3d8bfd;
      --danger: #e2556b;
      --line: #243552;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .app {
      height: 100%;
      padding: 10px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    h1 {
      margin: 0;
      font-size: 1.15rem;
    }
    .lead {
      margin: 0;
      color: var(--muted);
      line-height: 1.35;
      font-size: .82rem;
    }
    .status {
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: .92rem;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--stop);
      box-shadow: 0 0 0 3px rgba(107,124,148,.15);
      flex: 0 0 auto;
    }
    .dot.on {
      background: var(--ok);
      box-shadow: 0 0 0 3px rgba(47,191,113,.18);
    }
    .row { display: flex; gap: 8px; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 600;
      font-size: .9rem;
      cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: default; }
    .start { flex: 1; background: var(--accent); color: #fff; }
    .stop { flex: 1; background: #243147; color: var(--text); }
    .block {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .label {
      margin: 0 0 6px;
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #7f93b0;
      font-weight: 700;
    }
    .bind {
      color: #cfe0ff;
      font-size: .85rem;
      word-break: break-all;
    }
    .hub-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    select {
      flex: 1;
      min-width: 0;
      border: 1px solid #2d4263;
      background: #0c1422;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: .82rem;
    }
    .copy {
      flex: 0 0 auto;
      padding: 8px 10px;
      font-size: .78rem;
      background: #243552;
      color: var(--text);
      border-radius: 8px;
    }
    .hint {
      margin: 0;
      font-size: .75rem;
      color: var(--muted);
      line-height: 1.35;
    }
    .err {
      color: var(--danger);
      min-height: 1em;
      font-size: .82rem;
      margin: 0;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 18, .66);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(360px, 100%);
      background: #18263b;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    .modal h2 { margin: 0 0 4px; font-size: 1.05rem; }
    .modal p { margin: 0 0 12px; color: var(--muted); font-size: .82rem; }
    label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 5px; }
    input[type="number"] {
      width: 100%;
      border: 1px solid #2d4263;
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: .95rem;
      margin-bottom: 10px;
    }
    .check {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 12px;
      color: var(--text);
      font-size: .84rem;
      line-height: 1.3;
    }
    .check input { margin-top: 2px; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions button { flex: 1; }
    .save { background: var(--accent); color: #fff; }
    .cancel { background: #243147; color: var(--text); }
  </style>
</head>
<body>
  <div class="app">
    <div>
      <h1>ECJ EventQuiz Server</h1>
      <p class="lead">Start serveren, så React kan forbinde via SignalR.</p>
    </div>

    <div class="status">
      <span id="dot" class="dot" aria-hidden="true"></span>
      <strong id="statusText">Stoppet</strong>
    </div>

    <div class="row">
      <button id="btnStart" class="start" type="button">Start server</button>
      <button id="btnStop" class="stop" type="button" disabled>Stop</button>
    </div>

    <div class="block">
      <p class="label">Binder på</p>
      <code id="bind" class="bind">—</code>
    </div>

    <div class="block">
      <p class="label">Hub-URL</p>
      <div class="hub-row">
        <select id="hubSelect" aria-label="Hub-URL"></select>
        <button id="btnCopy" class="copy" type="button">Kopiér</button>
      </div>
    </div>

    <p class="hint">Vælg localhost, 127.0.0.1 eller LAN-IP. 0.0.0.0 er kun bind-adressen. Port sættes under Indstillinger.</p>
    <p class="err" id="err"></p>
  </div>

  <div id="settingsModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal">
      <h2 id="settingsTitle">Indstillinger</h2>
      <p>Gemmes lokalt og bruges næste gang serveren startes.</p>

      <label for="port">Port</label>
      <input id="port" type="number" min="1" max="65535" step="1" value="5188" />

      <label class="check">
        <input id="bindAll" type="checkbox" checked />
        <span>Lyt på alle netværkskort (<code>0.0.0.0</code>)</span>
      </label>

      <div class="modal-actions">
        <button id="btnCancel" class="cancel" type="button">Annuller</button>
        <button id="btnSave" class="save" type="button">Gem</button>
      </div>
      <div class="err" id="settingsErr"></div>
    </div>
  </div>

  <script>
    const statusText = document.getElementById('statusText');
    const dot = document.getElementById('dot');
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const bind = document.getElementById('bind');
    const hubSelect = document.getElementById('hubSelect');
    const btnCopy = document.getElementById('btnCopy');
    const err = document.getElementById('err');
    const settingsModal = document.getElementById('settingsModal');
    const portInput = document.getElementById('port');
    const bindAll = document.getElementById('bindAll');
    const settingsErr = document.getElementById('settingsErr');
    const btnSave = document.getElementById('btnSave');
    const btnCancel = document.getElementById('btnCancel');

    function post(type, payload = {}) {
      if (window.chrome?.webview)
        window.chrome.webview.postMessage({ type, ...payload });
    }

    function openSettings() {
      settingsErr.textContent = '';
      settingsModal.classList.add('open');
      post('settings.get');
    }

    function closeSettings() {
      settingsModal.classList.remove('open');
    }

    function preferredIndex(urls) {
      const lan = urls.findIndex((u) => !u.includes('localhost') && !u.includes('127.0.0.1'));
      return lan >= 0 ? 0 : 0; // localhost først som default
    }

    function renderUrls(urls) {
      const current = hubSelect.value;
      hubSelect.innerHTML = '';
      const list = urls?.length ? urls : [];
      if (!list.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '—';
        hubSelect.appendChild(opt);
        return;
      }
      for (const url of list) {
        const opt = document.createElement('option');
        opt.value = url;
        opt.textContent = url.replace('http://', '').replace('/hubs/quiz', '');
        hubSelect.appendChild(opt);
      }
      if (list.includes(current)) hubSelect.value = current;
      else hubSelect.selectedIndex = preferredIndex(list);
    }

    function render(state) {
      const running = !!state?.running;
      statusText.textContent = running ? `Kører (port ${state.port})` : 'Stoppet';
      dot.classList.toggle('on', running);
      btnStart.disabled = running;
      btnStop.disabled = !running;
      bind.textContent = state?.bindUrl || '—';
      renderUrls(state?.hubUrls);
      err.textContent = state?.error || '';
    }

    function renderSettings(state) {
      if (typeof state.port === 'number') portInput.value = String(state.port);
      bindAll.checked = !!state.bindAllInterfaces;
      const locked = !!state.running;
      portInput.disabled = locked;
      bindAll.disabled = locked;
      btnSave.disabled = locked;
      settingsErr.textContent = locked ? 'Stop serveren før du ændrer indstillinger.' : '';
    }

    btnStart.addEventListener('click', () => {
      err.textContent = '';
      post('server.start');
    });
    btnStop.addEventListener('click', () => {
      err.textContent = '';
      post('server.stop');
    });
    btnCopy.addEventListener('click', async () => {
      const url = hubSelect.value;
      if (!url) return;
      try {
        await navigator.clipboard.writeText(url);
        btnCopy.textContent = 'Kopieret';
        setTimeout(() => { btnCopy.textContent = 'Kopiér'; }, 1100);
      } catch {
        btnCopy.textContent = 'Fejl';
      }
    });
    btnCancel.addEventListener('click', closeSettings);
    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) closeSettings();
    });
    btnSave.addEventListener('click', () => {
      const port = Number(portInput.value);
      if (!Number.isInteger(port) || port < 1 || port > 65535) {
        settingsErr.textContent = 'Port skal være et heltal mellem 1 og 65535.';
        return;
      }
      settingsErr.textContent = '';
      post('settings.save', {
        port,
        bindAllInterfaces: bindAll.checked
      });
      closeSettings();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && settingsModal.classList.contains('open'))
        closeSettings();
    });

    if (window.chrome?.webview) {
      window.chrome.webview.addEventListener('message', (e) => {
        const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
        if (data?.type === 'server.status') render(data);
        if (data?.type === 'settings.state') renderSettings(data);
        if (data?.type === 'ui.openSettings') openSettings();
      });
      post('server.getStatus');
    } else {
      err.textContent = 'Åbn via WPF WebView2 for at styre serveren.';
    }
  </script>
</body>
</html>
